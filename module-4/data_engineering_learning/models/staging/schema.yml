version: 2

models:
  - name: stg_green_tripdata
    description: Staged green taxi trip data
    columns:
      - name: trip_id
        data_type: string
        description: ""
        data_tests:
          - not_null

      - name: vendor_id
        data_type: int64
        description: ""

      - name: rate_code_id
        data_type: int64
        description: ""

      - name: pickup_location_id
        data_type: int64
        description: ""
        data_tests:
          - relationships:
              field: locationid
              to: ref('taxi_zones_lookup')
              severity: warn

      - name: dropoff_location_id
        data_type: int64
        description: ""
        data_tests:
          - relationships:
              field: locationid
              to: ref('taxi_zones_lookup')
              severity: warn

      - name: pickup_datetime
        data_type: timestamp
        description: ""

      - name: dropoff_datetime
        data_type: timestamp
        description: ""

      - name: store_and_fwd_flag
        data_type: string
        description: ""

      - name: passenger_count
        data_type: int64
        description: ""

      - name: trip_distance
        data_type: numeric
        description: ""

      - name: fare_amount
        data_type: numeric
        description: ""

      - name: extra
        data_type: numeric
        description: ""

      - name: mta_tax
        data_type: numeric
        description: ""

      - name: tip_amount
        data_type: numeric
        description: ""

      - name: tolls_amount
        data_type: numeric
        description: ""

      - name: improvement_surcharge
        data_type: numeric
        description: ""

      - name: total_amount
        data_type: numeric
        description: ""

      - name: payment_type
        data_type: int64
        description: ""

      - name: payment_type_description
        data_type: string
        description: ""
        data_tests:
          - accepted_values:
              values: "{{ var('payment_type_values') }}"
              severity: warn
              quote: false

  - name: stg_yellow_tripdata
    description: Staged yellow taxi trip data
    columns:
      - name: trip_id
        data_type: string
        description: ""
        data_tests:
          - not_null

      - name: vendor_id
        data_type: int64
        description: ""

      - name: rate_code_id
        data_type: int64
        description: ""

      - name: pickup_location_id
        data_type: int64
        description: ""

      - name: dropoff_location_id
        data_type: int64
        description: ""

      - name: pickup_datetime
        data_type: timestamp
        description: ""

      - name: dropoff_datetime
        data_type: timestamp
        description: ""

      - name: store_and_fwd_flag
        data_type: string
        description: ""

      - name: passenger_count
        data_type: int64
        description: ""

      - name: trip_distance
        data_type: numeric
        description: ""

      - name: fare_amount
        data_type: numeric
        description: ""

      - name: extra
        data_type: numeric
        description: ""

      - name: mta_tax
        data_type: numeric
        description: ""

      - name: tip_amount
        data_type: numeric
        description: ""

      - name: tolls_amount
        data_type: numeric
        description: ""

      - name: improvement_surcharge
        data_type: numeric
        description: ""

      - name: total_amount
        data_type: numeric
        description: ""

      - name: payment_type
        data_type: int64
        description: ""

      - name: payment_type_description
        data_type: string
        description: ""
