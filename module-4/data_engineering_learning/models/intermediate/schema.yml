version: 2

models:
  - name: dim_monthly_zone_revenue
    description: ""
    columns:
      - name: pickup_zone
        data_type: string
        description: ""

      - name: revenue_month
        data_type: date
        description: ""

      - name: service_type
        data_type: string
        description: ""

      - name: revenue_monthly_fare
        data_type: numeric
        description: ""

      - name: revenue_monthly_extra
        data_type: numeric
        description: ""

      - name: revenue_monthly_mta_tax
        data_type: numeric
        description: ""

      - name: revenue_monthly_tip_amount
        data_type: numeric
        description: ""

      - name: revenue_monthly_tolls_amount
        data_type: numeric
        description: ""

      - name: revenue_monthly_improvement_surcharge
        data_type: numeric
        description: ""

      - name: revenue_monthly_total_amount
        data_type: numeric
        description: ""

      - name: total_monthly_trips
        data_type: int64
        description: ""

      - name: avg_monthly_passenger_count
        data_type: float64
        description: ""

      - name: avg_monthly_trip_distance
        data_type: numeric
        description: ""

  - name: dim_zones
    description: "Taxi zone dimension table with location details"
    columns:
      - name: locationid
        data_type: int64
        description: "Unique identifier for each taxi zone"
        data_tests:
          - unique
          - not_null

      - name: borough
        data_type: string
        description: "NYC borough name"

      - name: zone
        data_type: string
        description: "Specific zone name within the borough"

      - name: service_zone
        data_type: string
        description: "Service zone classification"
